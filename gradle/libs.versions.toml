[versions]
agp                   = "8.4.2"
kotlin                = "2.0.0"
ksp                   = "2.0.0-1.0.22"
coreKtx               = "1.13.1"
lifecycleRuntimeKtx   = "2.8.3"
activityCompose       = "1.9.0"
composeBom            = "2024.06.00"
navigation            = "2.7.7"
hilt                  = "2.51.1"
hiltNav               = "1.2.0"
room                  = "2.6.1"
cameraX               = "1.3.4"
firebaseBom           = "33.1.1"
coroutines            = "1.8.1"
datastore             = "1.1.1"
accompanist           = "0.34.0"
permissionsAccompanist = "0.34.0"
coil                  = "2.6.0"
junit                 = "4.13.2"
junitExt              = "1.2.1"
espresso              = "3.6.1"
mockk                 = "1.13.11"
turbine               = "1.1.0"
googleServices        = "4.4.2"

[libraries]
# AndroidX core
androidx-core-ktx              = { group = "androidx.core",           name = "core-ktx",                         version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle",      name = "lifecycle-runtime-ktx",            version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel   = { group = "androidx.lifecycle",      name = "lifecycle-viewmodel-compose",      version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose      = { group = "androidx.activity",       name = "activity-compose",                 version.ref = "activityCompose" }

# Compose BOM + libs
androidx-compose-bom           = { group = "androidx.compose",        name = "compose-bom",                      version.ref = "composeBom" }
androidx-ui                    = { group = "androidx.compose.ui",     name = "ui" }
androidx-ui-graphics           = { group = "androidx.compose.ui",     name = "ui-graphics" }
androidx-ui-tooling-preview    = { group = "androidx.compose.ui",     name = "ui-tooling-preview" }
androidx-ui-tooling            = { group = "androidx.compose.ui",     name = "ui-tooling" }
androidx-ui-test-manifest      = { group = "androidx.compose.ui",     name = "ui-test-manifest" }
androidx-ui-test-junit4        = { group = "androidx.compose.ui",     name = "ui-test-junit4" }
androidx-material3             = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons        = { group = "androidx.compose.material", name = "material-icons-extended" }

# Navigation
androidx-navigation-compose    = { group = "androidx.navigation",     name = "navigation-compose",               version.ref = "navigation" }

# Hilt
hilt-android                   = { group = "com.google.dagger",       name = "hilt-android",                     version.ref = "hilt" }
hilt-compiler                  = { group = "com.google.dagger",       name = "hilt-android-compiler",            version.ref = "hilt" }
hilt-navigation-compose        = { group = "androidx.hilt",           name = "hilt-navigation-compose",          version.ref = "hiltNav" }

# Room
room-runtime                   = { group = "androidx.room",           name = "room-runtime",                     version.ref = "room" }
room-ktx                       = { group = "androidx.room",           name = "room-ktx",                         version.ref = "room" }
room-compiler                  = { group = "androidx.room",           name = "room-compiler",                    version.ref = "room" }

# CameraX
camerax-core                   = { group = "androidx.camera",         name = "camera-core",                      version.ref = "cameraX" }
camerax-camera2                = { group = "androidx.camera",         name = "camera-camera2",                   version.ref = "cameraX" }
camerax-lifecycle              = { group = "androidx.camera",         name = "camera-lifecycle",                 version.ref = "cameraX" }
camerax-view                   = { group = "androidx.camera",         name = "camera-view",                      version.ref = "cameraX" }

# Firebase
firebase-bom                   = { group = "com.google.firebase",     name = "firebase-bom",                     version.ref = "firebaseBom" }
firebase-auth                  = { group = "com.google.firebase",     name = "firebase-auth-ktx" }
firebase-firestore             = { group = "com.google.firebase",     name = "firebase-firestore-ktx" }
firebase-messaging             = { group = "com.google.firebase",     name = "firebase-messaging-ktx" }

# Coroutines
kotlinx-coroutines-android     = { group = "org.jetbrains.kotlinx",  name = "kotlinx-coroutines-android",       version.ref = "coroutines" }
kotlinx-coroutines-play        = { group = "org.jetbrains.kotlinx",  name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }

# DataStore
datastore-preferences          = { group = "androidx.datastore",      name = "datastore-preferences",            version.ref = "datastore" }

# Accompanist Permissions
accompanist-permissions        = { group = "com.google.accompanist",  name = "accompanist-permissions",          version.ref = "accompanist" }

# Coil
coil-compose                   = { group = "io.coil-kt",             name = "coil-compose",                     version.ref = "coil" }

# Testing
junit                          = { group = "junit",                   name = "junit",                            version.ref = "junit" }
androidx-junit                 = { group = "androidx.test.ext",       name = "junit",                            version.ref = "junitExt" }
androidx-espresso              = { group = "androidx.test.espresso",  name = "espresso-core",                    version.ref = "espresso" }
mockk                          = { group = "io.mockk",                name = "mockk",                            version.ref = "mockk" }
turbine                        = { group = "app.cash.turbine",        name = "turbine",                          version.ref = "turbine" }
kotlinx-coroutines-test        = { group = "org.jetbrains.kotlinx",  name = "kotlinx-coroutines-test",          version.ref = "coroutines" }

[plugins]
android-application = { id = "com.android.application",          version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android",     version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt               = { id = "com.google.dagger.hilt.android",    version.ref = "hilt" }
ksp                = { id = "com.google.devtools.ksp",           version.ref = "ksp" }
google-services    = { id = "com.google.gms.google-services",    version.ref = "googleServices" }
